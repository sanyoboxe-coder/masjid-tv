<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تسيير شاشة المسجد</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 15px; }
    .header { text-align: center; margin-bottom: 20px; padding: 10px; border-bottom: 1px solid #334155; }
    .header h2 { color: #38bdf8; font-size: 1.4rem; }
    .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
    .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    label { display: block; font-size: 0.9rem; margin-bottom: 5px; color: #94a3b8; }
    input, select, textarea {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #fff; font-size: 1rem; margin-bottom: 12px; outline: none;
    }
    input:focus, textarea:focus { border-color: #38bdf8; }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-green:hover { background: #15803d; }
    .btn-danger { background: #dc2626; color: #fff; margin-top: 5px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🕌 إدارة شاشة المسجد</h2>
    <p style="font-size: 0.85rem; color: #94a3b8;">تحديث المحتوى المباشر على التلفاز</p>
  </div>

  <!-- قسم صلاة الجنازة -->
  <div class="card" style="border-top: 4px solid #ef4444;">
    <div class="card-title" style="color: #f87171;">⚰️ إعلان صلاة الجنازة</div>
    <div class="toggle-row">
      <span>تفعيل إعلان الجنازة على الشاشة:</span>
      <input type="checkbox" id="janazaActive" style="width: 20px; height: 20px; margin: 0;">
    </div>
    <label>اسم المتوفى أو الوصف (مثلاً: المرحوم الحاج... أو جنازة رجل / امرأة):</label>
    <input type="text" id="janazaName" placeholder="مثال: المرحوم فلان بن فلان">
    
    <label>موعد الصلاة:</label>
    <select id="janazaTime">
      <option value="بعد صلاة الظهر">بعد صلاة الظهر</option>
      <option value="بعد صلاة العصر">بعد صلاة العصر</option>
      <option value="بعد صلاة المغرب">بعد صلاة المغرب</option>
      <option value="بعد صلاة العشاء">بعد صلاة العشاء</option>
      <option value="بعد صلاة الجمعة">بعد صلاة الجمعة</option>
    </select>
  </div>

  <!-- قسم الدروس والمواعظ -->
  <div class="card" style="border-top: 4px solid #38bdf8;">
    <div class="card-title" style="color: #38bdf8;">📖 درس اليوم والمواعظ</div>
    <div class="toggle-row">
      <span>عرض بطاقة الدرس:</span>
      <input type="checkbox" id="lessonActive" style="width: 20px; height: 20px; margin: 0;">
    </div>
    <label>عنوان الدرس أو الموعظة:</label>
    <input type="text" id="lessonTitle" placeholder="مثال: شرح كتاب رياض الصالحين">
    
    <label>اسم الأستاذ / الشيخ المحاضر:</label>
    <input type="text" id="lessonLecturer" placeholder="مثال: فضيلة الشيخ الدكتور...">
    
    <label>الموعد المحدد:</label>
    <input type="text" id="lessonTime" placeholder="مثال: كل جمعة بين المغرب والعشاء">
  </div>

  <!-- قسم الإعلان العام والشريط المتحرك -->
  <div class="card" style="border-top: 4px solid #facc15;">
    <div class="card-title" style="color: #facc15;">📢 الشريط المتحرك والإعلانات العامة</div>
    <label>نص الشريط الإخباري (الأسفل):</label>
    <textarea id="footerText" rows="2" placeholder="أدخل نص التنبيه أو الحديث أو الإعلان"></textarea>
    
    <label>إعلان خاص مؤقت في مربع الأذكار (اختياري):</label>
    <input type="text" id="announcementText" placeholder="اتركه فارغاً لتعمل الأذكار التلقائية">
  </div>

  <!-- قسم تعديل مدد الإقامة -->
  <div class="card" style="border-top: 4px solid #10b981;">
    <div class="card-title" style="color: #34d399;">⏱️ ضبط دقائق الإقامة (بالدقيقة)</div>
    <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; text-align: center;">
      <div><label>الفجر</label><input type="number" id="iqFajr" value="20"></div>
      <div><label>الظهر</label><input type="number" id="iqDhuhr" value="15"></div>
      <div><label>العصر</label><input type="number" id="iqAsr" value="15"></div>
      <div><label>المغرب</label><input type="number" id="iqMaghrib" value="10"></div>
      <div><label>العشاء</label><input type="number" id="iqIsha" value="15"></div>
    </div>
  </div>

  <button class="btn btn-green" onclick="generateConfig()">💾 نسخ كود الإعدادات الجديد (JSON)</button>

  <div id="outputSection" style="display: none; margin-top: 15px;">
    <label style="color: #38bdf8; font-weight: bold;">انسخ هذا النص وضعه في ملف remote_settings.json:</label>
    <textarea id="jsonOutput" rows="8" readonly onclick="this.select()"></textarea>
  </div>

  <script>
    function generateConfig() {
      var config = {
        reloadVersion: Math.floor(Date.now() / 1000),
        masjidTitle: "مسجد أبي هريرة تجزئة أندلس القنيطرة - KENITRA",
        announcement: document.getElementById('announcementText').value,
        footerText: document.getElementById('footerText').value,
        hijriDate: "",
        delays: {
          Fajr: parseInt(document.getElementById('iqFajr').value) || 20,
          Dhuhr: parseInt(document.getElementById('iqDhuhr').value) || 15,
          Asr: parseInt(document.getElementById('iqAsr').value) || 15,
          Maghrib: parseInt(document.getElementById('iqMaghrib').value) || 10,
          Isha: parseInt(document.getElementById('iqIsha').value) || 15
        },
        janaza: {
          active: document.getElementById('janazaActive').checked,
          name: document.getElementById('janazaName').value,
          time: document.getElementById('janazaTime').value
        },
        lesson: {
          active: document.getElementById('lessonActive').checked,
          title: document.getElementById('lessonTitle').value,
          lecturer: document.getElementById('lessonLecturer').value,
          time: document.getElementById('lessonTime').value
        }
      };

      var output = JSON.stringify(config, null, 2);
      document.getElementById('jsonOutput').value = output;
      document.getElementById('outputSection').style.display = 'block';
      alert('تم تجهيز الإعدادات بنجاح! انسخ النص وضعْه في remote_settings.json');
    }
  </script>
</body>
</html>
