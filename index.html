<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسجد أبي هريرة - القنيطرة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    
    /* خلفية المسجد الأصلية واضحة ومباشرة على الشاشة كاملة */
    body {
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px 25px;
      background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.40)), url('1000208998.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    /* الشريط العلوي */
    .top-bar { 
      background: rgba(0, 0, 0, 0.45); padding: 8px 25px; border-radius: 14px;
      display: flex; justify-content: space-between; align-items: center; 
      border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(3px);
    }
    .masjid-title { font-size: 1.6rem; font-weight: 900; color: #ffffff; text-shadow: 0 2px 5px #000; }
    .top-tools { display: flex; align-items: center; gap: 15px; }
    .settings-trigger { cursor: pointer; opacity: 0.9; font-size: 1.5rem; }

    /* القسم الأوسط */
    .center-section { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 10px; }
    .side-box { 
      text-align: center; min-width: 155px; background: rgba(0, 0, 0, 0.45); 
      padding: 10px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(3px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .side-title { font-size: 1.3rem; font-weight: 800; color: #e2e8f0; text-shadow: 0 2px 4px #000; }
    .side-time { font-size: 2.6rem; font-weight: 900; font-family: monospace; color: #ffffff; text-shadow: 0 2px 6px #000; }

    .clock-card { 
      background: rgba(0, 0, 0, 0.50); 
      border-radius: 24px; padding: 12px 45px; text-align: center; min-width: 520px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 2px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(4px);
    }
    .main-clock { font-size: 5rem; font-weight: 900; font-family: monospace; line-height: 1; letter-spacing: 2px; text-shadow: 0 3px 10px #000; }
    .hijri-date { font-size: 1.5rem; font-weight: 900; color: #facc15; margin-top: 6px; text-shadow: 0 2px 5px #000; }
    .greg-date { font-size: 1.2rem; font-weight: 800; color: #ffffff; margin-top: 2px; text-shadow: 0 2px 4px #000; }

    .middle-info-bar { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 0 10px; }
    .dhikr-box { 
      flex: 1.8; background: rgba(0, 0, 0, 0.45); border-radius: 18px; 
      padding: 10px 25px; font-size: 1.35rem; text-align: center; white-space: nowrap; 
      overflow: hidden; text-overflow: ellipsis; border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(3px); text-shadow: 0 2px 6px #000; font-weight: bold;
    }
    .countdown-bar { 
      flex: 1.2; background: rgba(0, 0, 0, 0.50); border-radius: 18px; 
      padding: 10px 25px; display: flex; align-items: center; justify-content: center; 
      gap: 10px; font-size: 1.35rem; font-weight: 800; border: 1px solid rgba(255,255,255,0.3);
      backdrop-filter: blur(3px); text-shadow: 0 2px 5px #000;
    }
    .countdown-bar .count-val { font-family: monospace; font-size: 1.9rem; color: #38bdf8; direction: ltr; font-weight: 900; text-shadow: 0 2px 6px #000; }

    /* بطاقات أوقات الصلاة */
    .prayers-row { display: flex; justify-content: space-between; gap: 12px; padding: 0 10px; }
    .p-card { 
      flex: 1; background: rgba(0, 0, 0, 0.48); border-radius: 18px; 
      padding: 10px 6px; text-align: center; border: 1.5px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(3px); box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    .p-card.active-p { 
      background: rgba(14, 116, 144, 0.75); 
      border-color: #38bdf8; transform: translateY(-4px); box-shadow: 0 8px 25px rgba(56, 189, 248, 0.5);
    }
    .p-name { font-size: 1.55rem; font-weight: 900; text-shadow: 0 2px 6px #000; }
    .p-subname { font-size: 0.85rem; font-weight: 700; color: #e2e8f0; text-transform: uppercase; margin-bottom: 2px; }
    .p-time { font-size: 2.5rem; font-weight: 900; font-family: monospace; text-shadow: 0 2px 6px #000; }
    .p-iqama { font-size: 1.25rem; font-weight: 900; color: #facc15; direction: ltr; text-shadow: 0 2px 5px #000; }

    /* الشريط السفلي المتحرك */
    .bottom-bar { 
      background: rgba(0, 0, 0, 0.50); padding: 6px 20px; border-radius: 12px; 
      overflow: hidden; white-space: nowrap; display: flex; align-items: center; height: 44px;
      border: 1px solid rgba(255,255,255,0.25); backdrop-filter: blur(3px);
    }
    .marquee-content {
      display: inline-block; padding-left: 100%; animation: marquee 30s linear infinite;
      font-size: 1.3rem; font-weight: 800; color: #facc15; text-shadow: 0 2px 6px #000;
    }
    @keyframes marquee { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(-100%,0,0); } }

    /* شاشة الإقامة */
    .fullscreen-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.96); z-index: 99999; display: none;
      flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px;
    }
    .modal-head { font-size: 3.4rem; font-weight: 900; color: #facc15; margin-bottom: 10px; }
    .modal-timer { font-size: 9.5rem; font-weight: 900; font-family: monospace; color: #facc15; text-shadow: 0 0 30px rgba(250,204,21,0.6); direction: ltr; }
    .modal-body { font-size: 2.4rem; font-weight: 800; color: #ffffff; line-height: 1.5; max-width: 90%; }
    .modal-sub { font-size: 2rem; font-weight: 900; color: #ef4444; margin-top: 25px; background: rgba(239,68,68,0.2); padding: 8px 25px; border-radius: 14px; border: 1px solid #ef4444; }

    /* نافذة الإعدادات */
    .setup-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 6, 23, 0.95); z-index: 100000;
      display: none; justify-content: center; align-items: center; padding: 15px;
    }
    .setup-box {
      background: #0f172a; border: 2px solid #38bdf8; border-radius: 20px;
      padding: 20px 25px; width: 100%; max-width: 620px; text-align: right;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8); max-height: 92vh; overflow-y: auto;
    }
    .setup-title { font-size: 1.3rem; font-weight: 900; color: #38bdf8; text-align: center; margin-bottom: 10px; }
    .timing-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .timing-table th, .timing-table td { padding: 6px; text-align: center; border-bottom: 1px solid #334155; }
    .timing-table th { color: #94a3b8; font-size: 0.9rem; }
    .btn-step { background: #1e293b; border: 1px solid #475569; color: #fff; width: 32px; height: 32px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
    .input-val { width: 50px; text-align: center; background: #020617; border: 1px solid #38bdf8; color: #facc15; font-size: 1.1rem; font-weight: bold; padding: 4px; border-radius: 6px; }
    
    .field-group { margin-top: 10px; }
    .field-label { display: block; font-size: 0.9rem; color: #94a3b8; margin-bottom: 4px; font-weight: bold; }
    .field-input { width: 100%; background: #020617; border: 1px solid #334155; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; }
    .field-select { width: 100%; background: #020617; border: 1px solid #38bdf8; color: #facc15; padding: 8px 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; }

    .btn-save { background: #16a34a; color: #fff; width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 900; cursor: pointer; margin-top: 15px; }
    .btn-close { background: #475569; color: #fff; width: 100%; padding: 8px; border: none; border-radius: 10px; font-size: 0.95rem; cursor: pointer; margin-top: 6px; }
  </style>
</head>
<body>

  <!-- شاشة الإقامة الكبرى -->
  <div class="fullscreen-modal" id="fsModal">
    <div class="modal-head" id="fsHead">إِقَامَةُ الصَّلَاةِ</div>
    <div class="modal-timer" id="fsTimer" style="display:none;">00:00</div>
    <div class="modal-body">اسْتَوُوا وَاعْتَدِلُوا، وَأَقِيمُوا صُفُوفَكُمْ</div>
    <div class="modal-sub">📴 يُرْجَى إِغْلَاقُ الْهَوَاتِفِ النَّقَّالَةِ جَزَاكُمُ اللهُ خَيْرًا</div>
  </div>

  <!-- لوحة الإعدادات -->
  <div class="setup-overlay" id="setupModal">
    <div class="setup-box">
      <div class="setup-title">⚙️ لوحة تحكم مسجد أبي هريرة</div>
      
      <div class="field-group">
        <label class="field-label">نظام التوقيت (حل مشكل الساعة الزائدة):</label>
        <select id="cfg_tz" class="field-select">
          <option value
