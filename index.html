<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مسجد أبي هريرة - القنيطرة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(rgba(8, 20, 48, 0.45), rgba(5, 12, 30, 0.60)), url('IMG-20260930-WA0025.jpg') no-repeat center center fixed;
      background-size: cover; color: #fff; font-family: system-ui, -apple-system, sans-serif;
      height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
    }
    .top-bar { background: rgba(10, 25, 55, 0.85); padding: 8px 25px; display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem; font-weight: 700; }
    .temp-badge { font-size: 1.4rem; font-weight: 900; color: #facc15; background: rgba(255,255,255,0.1); padding: 4px 14px; border-radius: 20px; }
    .status-badge { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; color: #93c5fd; }
    .status-dot { width: 11px; height: 11px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }
    .center-section { display: flex; align-items: center; justify-content: space-around; padding: 4px 30px; width: 100%; }
    .side-box { text-align: center; min-width: 160px; }
    .side-title { font-size: 1.7rem; font-weight: 800; }
    .side-time { font-size: 2.7rem; font-weight: 900; font-family: monospace; }
    .clock-card { background: linear-gradient(180deg, #1d4ed8, #1e40af); border-radius: 20px; padding: 10px 45px 8px; text-align: center; min-width: 460px; box-shadow: 0 10px 25px rgba(29,78,216,0.5); }
    .main-clock { font-size: 4.8rem; font-weight: 900; font-family: monospace; }
    .main-date { font-size: 1.45rem; font-weight: bold; color: #facc15; margin-top: 4px; }
    .middle-info-bar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 35px; }
    .dhikr-box { flex: 1.8; background: rgba(15,23,42,0.75); border-radius: 25px; padding: 7px 25px; font-size: 1.35rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .countdown-bar { flex: 1.2; background: rgba(15,23,42,0.85); border-radius: 25px; padding: 7px 25px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.5rem; font-weight: 800; }
    .countdown-bar .count-val { font-family: monospace; font-size: 1.8rem; color: #38bdf8; direction: ltr; }
    .prayers-row { display: flex; justify-content: center; gap: 12px; padding: 6px 30px; }
    .p-card { flex: 1; background: rgba(15,23,42,0.72); border-radius: 18px; padding: 10px 5px; text-align: center; border: 2px solid rgba(255,255,255,0.18); }
    .p-card.active-p { background: rgba(30,64,175,0.85); border: 2px solid #60a5fa; transform: translateY(-3px); }
    .p-name { font-size: 1.85rem; font-weight: 900; }
    .p-time { font-size: 2.7rem; font-weight: 900; font-family: monospace; }
    .p-iqama { font-size: 1.6rem; font-weight: 900; color: #93c5fd; direction: ltr; }
    .bottom-bar { background: rgba(10,25,55,0.9); padding: 6px 30px; display: flex; justify-content: center; align-items: center; gap: 20px; font-size: 1.3rem; font-weight: 800; color: #cbd5e1; direction: rtl; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div id="topMasjidTitle">مسجد أبي هريرة تجزئة أندلس القنيطرة - KENITRA</div>
    <div style="display:flex;align-items:center;gap:20px;">
      <div class="temp-badge">🌤 20°C</div>
      <div class="status-badge"><span class="status-dot"></span><span>الأوقاف سنوية</span></div>
    </div>
  </div>

  <div class="center-section">
    <div class="side-box"><div class="side-title">الجمعة</div><div class="side-time" id="dispJumua">--:--</div></div>
    <div class="clock-card"><div class="main-clock" id="liveClock">--:--:--</div><div class="main-date" id="liveDate">...</div></div>
    <div class="side-box"><div class="side-title">الشروق</div><div class="side-time" id="dispSunrise">--:--</div></div>
  </div>

  <div class="middle-info-bar">
    <div class="dhikr-box" id="dhikrText">«سُبْحَانَ اللهِ وَبِحَمْدِهِ، سُبْحَانَ اللهِ الْعَظِيمِ»</div>
    <div class="countdown-bar"><span>⏳</span><span id="countdownLabel">الصلاة بعد</span><span class="count-val" id="countdownVal">--:--:--</span></div>
  </div>

  <div class="prayers-row">
    <div class="p-card" id="card-Fajr"><div class="p-name">الفجر</div><div class="p-time" id="time-Fajr">--:--</div><div class="p-iqama" id="iqama-Fajr">+20</div></div>
    <div class="p-card" id="card-Dhuhr"><div class="p-name">الظهر</div><div class="p-time" id="time-Dhuhr">--:--</div><div class="p-iqama" id="iqama-Dhuhr">+15</div></div>
    <div class="p-card" id="card-Asr"><div class="p-name">العصر</div><div class="p-time" id="time-Asr">--:--</div><div class="p-iqama" id="iqama-Asr">+15</div></div>
    <div class="p-card" id="card-Maghrib"><div class="p-name">المغرب</div><div class="p-time" id="time-Maghrib">--:--</div><div class="p-iqama" id="iqama-Maghrib">+10</div></div>
    <div class="p-card" id="card-Isha"><div class="p-name">العشاء</div><div class="p-time" id="time-Isha">--:--</div><div class="p-iqama" id="iqama-Isha">+15</div></div>
  </div>

  <div class="bottom-bar">
    <span>عبد العالي العزري</span><span>•</span><span style="direction: ltr; display: inline-block;">06 70 62 68 34</span>
  </div>

  <script>
    var PRAYERS = [
      { key: "Fajr", nameAr: "الفجر" },
      { key: "Dhuhr", nameAr: "الظهر" },
      { key: "Asr", nameAr: "العصر" },
      { key: "Maghrib", nameAr: "المغرب" },
      { key: "Isha", nameAr: "العشاء" }
    ];

    function toRad(d) { return d * Math.PI / 180; }
    function toDeg(r) { return r * 180 / Math.PI; }

    function calcTimes(dateObj) {
      var y = dateObj.getFullYear();
      var m = dateObj.getMonth() + 1;
      var d = dateObj.getDate();

      var N = Math.floor(275 * m / 9) - Math.floor((m + 9) / 12) * (1 + Math.floor((y - 4 * Math.floor(y / 4) + 2) / 3)) + d - 30;
      var lngHour = -6.5802 / 15.0;
      var lat = 34.2610;

      function sunData(t) {
        var M = (0.9856 * t) - 3.289;
        var L = (M + (1.916 * Math.sin(toRad(M))) + (0.020 * Math.sin(toRad(2 * M))) + 282.634) % 360;
        if (L < 0) L += 360;
        var RA = toDeg(Math.atan(0.91764 * Math.tan(toRad(L)))) % 360;
        if (RA < 0) RA += 360;
        var Lq = Math.floor(L / 90) * 90;
        var RAq = Math.floor(RA / 90) * 90;
        RA = (RA + (Lq - RAq)) / 15.0;
        var sinDec = 0.39782 * Math.sin(toRad(L));
        var cosDec = Math.cos(Math.asin(sinDec));
        return { RA: RA, sinDec: sinDec, cosDec: cosDec };
      }

      function getTimeForAngle(angle, isRise, isSunAngle) {
        var t = N + ((isRise ? 6 : 18) - lngHour) / 24.0;
        var s = sunData(t);
        var cosH = 0;
        if (isSunAngle) {
          cosH = (Math.sin(toRad(angle)) - (s.sinDec * Math.sin(toRad(lat)))) / (s.cosDec * Math.cos(toRad(lat)));
        } else {
          var decDeg = toDeg(Math.asin(s.sinDec));
          var term = Math.tan(toRad(Math.abs(lat - decDeg)));
          var alt = toDeg(Math.atan(1.0 / (1.0 + term)));
          cosH = (Math.sin(toRad(alt)) - (s.sinDec * Math.sin(toRad(lat)))) / (s.cosDec * Math.cos(toRad(lat)));
        }
        if (cosH > 1) cosH = 1;
        if (cosH < -1) cosH = -1;
        var H = isRise ? (360 - toDeg(Math.acos(cosH))) : toDeg(Math.acos(cosH));
        H = H / 15.0;
        var UT = (H + s.RA - (0.06571 * t) - 6.622 - lngHour) % 24;
        if (UT < 0) UT += 24;
        return UT; // مضبوط على توقيت غرينتش GMT+0 مباشرة بدون زيادة ساعة
      }

      function padTime(v) {
        var h = Math.floor(v);
        var min = Math.round((v - h) * 60);
        if (min >= 60) { h += 1; min = 0; }
        var hStr = (h < 10 ? '0' : '') + (h % 24);
        var mStr = (min < 10 ? '0' : '') + min;
        return hStr + ':' + mStr;
      }

      var M_val = (0.9856 * N) - 3.289;
      var EoT = -7.655 * Math.sin(toRad(M_val)) + 9.873 * Math.sin(2 * toRad(M_val) + 3.588);
      var noon = 12.0 - lngHour - (EoT / 60.0) + (5.0 / 60.0) - 0.44; // GMT+0

      return {
        Fajr: padTime(getTimeForAngle(-19.0, true, true) + (5.0 / 60.0)),
        Sunrise: padTime(getTimeForAngle(-0.833, true, true) - (3.0 / 60.0)),
        Dhuhr: padTime(noon),
        Asr: padTime(getTimeForAngle(0, false, false) + (2.0 / 60.0)),
        Maghrib: padTime(getTimeForAngle(-0.833, false, true) - (2.0 / 60.0)),
        Isha: padTime(getTimeForAngle(-17.0, false, true) + (2.0 / 60.0))
      };
    }

    var timings = {};
    var cachedDay = -1;

    function refreshPrayers() {
      var now = new Date();
      timings = calcTimes(now);
      document.getElementById('dispSunrise').innerText = timings.Sunrise;
      document.getElementById('dispJumua').innerText = timings.Dhuhr;
      for (var i = 0; i < PRAYERS.length; i++) {
        var p = PRAYERS[i];
        var el = document.getElementById('time-' + p.key);
        if (el) el.innerText = timings[p.key];
      }
      cachedDay = now.getDate();
    }

    function tick() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      var s = now.getSeconds();
      document.getElementById('liveClock').innerText = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;

      var days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
      document.getElementById('liveDate').innerText = days[now.getDay()] + '، ' + now.getDate() + '-' + (now.getMonth() + 1) + '-' + now.getFullYear() + ' م';

      if (now.getDate() !== cachedDay) {
        refreshPrayers();
      }

      if (!timings.Fajr) return;

      var curSecs = h * 3600 + m * 60 + s;
      var nextP = null;
      var diff = 0;

      for (var i = 0; i < PRAYERS.length; i++) {
        var p = PRAYERS[i];
        var parts = timings[p.key].split(':');
        var adhanSecs = Number(parts[0]) * 3600 + Number(parts[1]) * 60;
        if (adhanSecs > curSecs) {
          nextP = p;
          diff = adhanSecs - curSecs;
          break;
        }
      }

      if (!nextP) {
        nextP = PRAYERS[0];
        var fparts = timings.Fajr.split(':');
        diff = (86400 - curSecs) + (Number(fparts[0]) * 3600 + Number(fparts[1]) * 60);
      }

      var cards = document.querySelectorAll('.p-card');
      for (var c = 0; c < cards.length; c++) cards[c].classList.remove('active-p');
      var cardEl = document.getElementById('card-' + nextP.key);
      if (cardEl) cardEl.classList.add('active-p');
      document.getElementById('countdownLabel').innerText = nextP.nameAr + ' بعد';

      var rh = Math.floor(diff / 3600);
      var rm = Math.floor((diff % 3600) / 60);
      var rs = diff % 60;
      document.getElementById('countdownVal').innerText = (rh < 10 ? '0' : '') + rh + ':' + (rm < 10 ? '0' : '') + rm + ':' + (rs < 10 ? '0' : '') + rs;
    }

    refreshPrayers();
    tick();
    setInterval(tick, 1000);

    var currentReloadVersion = null;

    function checkRemoteCommands() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'remote_settings.json?t=' + new Date().getTime(), true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (data.reloadVersion !== undefined) {
              if (currentReloadVersion !== null && currentReloadVersion !== data.reloadVersion) {
                window.location.reload(true);
              }
              currentReloadVersion = data.reloadVersion;
            }
            if (data.announcement) {
              var el = document.getElementById('dhikrText');
              if (el && data.announcement !== "") {
                el.innerText = data.announcement;
              }
            }
            if (data.delays) {
              if (data.delays.Fajr) document.getElementById('iqama-Fajr').innerText = '+' + data.delays.Fajr;
              if (data.delays.Dhuhr) document.getElementById('iqama-Dhuhr').innerText = '+' + data.delays.Dhuhr;
              if (data.delays.Asr) document.getElementById('iqama-Asr').innerText = '+' + data.delays.Asr;
              if (data.delays.Maghrib) document.getElementById('iqama-Maghrib').innerText = '+' + data.delays.Maghrib;
              if (data.delays.Isha) document.getElementById('iqama-Isha').innerText = '+' + data.delays.Isha;
            }
          } catch (e) {}
        }
      };
      xhr.send();
    }

    setInterval(checkRemoteCommands, 15000);
    checkRemoteCommands();
  </script>
</body>
</html>
