<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسجد أبي هريرة - القنيطرة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    
    body {
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px 25px;
      position: relative;
    }

    /* صورة المسجد واضحة 100% وبكامل إضاءتها الطبيعية ملء الشاشة */
    .bg-fullscreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.85) contrast(1.05); /* إضاءة واضحة ومشرقة */
    }

    .app-content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* الشريط العلوي شفاف */
    .top-bar { 
      background: rgba(0, 0, 0, 0.45); padding: 8px 25px; border-radius: 14px;
      display: flex; justify-content: space-between; align-items: center; 
      border: 1px solid rgba(255,255,255,0.25); backdrop-filter: blur(4px);
    }
    .masjid-title { font-size: 1.6rem; font-weight: 900; color: #ffffff; text-shadow: 0 2px 6px #000; }
    .top-tools { display: flex; align-items: center; gap: 15px; }
    .settings-trigger { cursor: pointer; opacity: 0.9; font-size: 1.5rem; transition: transform 0.2s; }
    .settings-trigger:hover { transform: scale(1.1); }

    /* القسم الأوسط */
    .center-section { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 10px; }
    .side-box { 
      text-align: center; min-width: 155px; background: rgba(0, 0, 0, 0.45); 
      padding: 10px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(4px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .side-title { font-size: 1.3rem; font-weight: 800; color: #e2e8f0; text-shadow: 0 2px 4px #000; }
    .side-time { font-size: 2.6rem; font-weight: 900; font-family: monospace; color: #ffffff; text-shadow: 0 2px 6px #000; }

    .clock-card { 
      background: rgba(0, 0, 0, 0.55); 
      border-radius: 24px; padding: 12px 45px; text-align: center; min-width: 520px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 2px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(5px);
    }
    .main-clock { font-size: 5rem; font-weight: 900; font-family: monospace; line-height: 1; letter-spacing: 2px; text-shadow: 0 3px 10px #000; }
    .hijri-date { font-size: 1.5rem; font-weight: 900; color: #facc15; margin-top: 6px; text-shadow: 0 2px 5px #000; }
    .greg-date { font-size: 1.2rem; font-weight: 800; color: #ffffff; margin-top: 2px; text-shadow: 0 2px 4px #000; }

    .middle-info-bar { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 0 10px; }
    .dhikr-box { 
      flex: 1.8; background: rgba(0, 0, 0, 0.45); border-radius: 18px; 
      padding: 10px 25px; font-size: 1.35rem; text-align: center; white-space: nowrap; 
      overflow: hidden; text-overflow: ellipsis; border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(4px); text-shadow: 0 2px 6px #000; font-weight: bold;
    }
    .countdown-bar { 
      flex: 1.2; background: rgba(0, 0, 0, 0.55); border-radius: 18px; 
      padding: 10px 25px; display: flex; align-items: center; justify-content: center; 
      gap: 10px; font-size: 1.35rem; font-weight: 800; border: 1px solid rgba(255,255,255,0.25);
