<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسجد أبي هريرة - القنيطرة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(rgba(8, 20, 48, 0.45), rgba(5, 12, 30, 0.60)), 
                  url('IMG-20260930-WA0025.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* الشريط العلوي */
    .top-bar {
      background: rgba(10, 25, 55, 0.85);
      backdrop-filter: blur(8px);
      padding: 10px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 1.3rem;
      font-weight: 700;
    }
    .top-bar .title {
      font-size: 1.5rem;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .top-bar .status-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
      color: #93c5fd;
    }
    .status-dot {
      width: 12px;
      height: 12px;
      background-color: #22c55e;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #22c55e;
      transition: background-color 0.3s;
    }
    .status-dot.offline {
      background-color: #f97316 !important;
      box-shadow: 0 0 8px #f97316 !important;
    }

    /* المنطقة الوسطى */
    .center-section {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px 40px;
      width: 100%;
    }

    .side-box {
      text-align: center;
      min-width: 170px;
    }
    .side-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .side-time {
      font-size: 2.8rem;
      font-weight: 900;
      color: #ffffff;
      font-family: monospace;
      letter-spacing: 1px;
    }

    /* صندوق الساعة والتاريخ */
    .clock-card {
      background: linear-gradient(180deg, #1d4ed8 0%, #1e40af 100%);
      border-radius: 20px;
      padding: 15px 50px 12px 50px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(29, 78, 216, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.25);
      min-width: 480px;
    }
    .main-clock {
      font-size: 5rem;
      font-weight: 900;
      font-family: monospace;
      color: #ffffff;
      line-height: 1;
      letter-spacing: 3px;
    }
    .main-date {
      font-size: 1.5rem;
      font-weight: bold;
      color: #facc15;
      margin-top: 8px;
      transition: opacity 0.4s ease;
      min-height: 35px;
    }

    /* شريط العد التنازلي */
    .countdown-bar {
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 8px 35px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.6rem;
      font-weight: 800;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .countdown-bar .badge-icon {
      color: #facc15;
    }
    .countdown-bar .count-val {
      font-family: monospace;
      font-size: 1.8rem;
      color: #38bdf8;
      direction: ltr;
    }

    /* أشرطة الصلوات الخمس */
    .prayers-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 10px 30px 25px 30px;
      width: 100%;
    }
    .p-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      padding: 15px 5px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .p-card.active-p {
      background: rgba(30, 64, 175, 0.85);
      border: 2px solid #60a5fa;
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.5);
    }
    .p-name {
      font-size: 1.9rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .p-time {
      font-size: 2.8rem;
      font-weight: 900;
      font-family: monospace;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .p-iqama {
      font-size: 1.7rem;
      font-weight: 900;
      color: #93c5fd;
      margin-top: 6px;
      direction: ltr;
    }

    /* شاشة الأذان */
    #adhanOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(7, 18, 48, 0.85), rgba(4, 10, 28, 0.95)), 
                  url('IMG-20260930-WA0025.jpg') no-repeat center center fixed;
      background-size: cover;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .adhan-big-title {
      font-size: 7.5rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 35px rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 30px;
    }
    .adhan-sub {
      font-size: 2.5rem;
      font-weight: 800;
      color: #facc15;
    }
  </style>
</head>
<body>

  <!-- شاشة الأذان -->
  <div id="adhanOverlay">
    <div class="adhan-big-title">
      <span>🕌</span> الأذان <span>🕌</span>
    </div>
    <div class="adhan-sub" id="adhanPrayerSub">حان الآن موعد أذان الصلاة</div>
  </div>

  <!-- الشريط العلوي -->
  <div class="top-bar">
    <div class="title" id="dispMasjidTitle">مسجد أبي هريرة تجزئة أندلس القنيطرة - KENITRA</div>
    <div class="status-badge" id="netStatusBadge">
      <span class="status-dot" id="netDot"></span>
      <span id="netStatusText">متصل</span>
    </div>
  </div>

  <!-- المنطقة الوسطى -->
  <div class="center-section">
    <div class="side-box">
      <div class="side-title">الجمعة</div>
      <div class="side-time" id="dispJumua">13:30</div>
    </div>

    <div class="clock-card">
      <div class="main-clock" id="liveClock">00:00:00</div>
      <div class="main-date" id="liveDate">جاري التحميل...</div>
    </div>

    <div class="side-box">
      <div class="side-title">الشروق</div>
      <div class="side-time" id="dispSunrise">--:--</div>
    </div>
  </div>

  <!-- شريط العد التنازلي -->
  <div class="countdown-bar">
    <span class="badge-icon">⏳</span>
    <span id="countdownLabel">الصلاة بعد</span>
    <span class="count-val" id="countdownVal">--:--:--</span>
  </div>

  <!-- الصلوات الخمس -->
  <div class="prayers-row">
    <div class="p-card" id="card-Fajr">
      <div class="p-name">الفجر</div>
      <div class="p-time" id="time-Fajr">--:--</div>
      <div class="p-iqama">+20</div>
    </div>
    <div class="p-card" id="card-Dhuhr">
      <div class="p-name">الظهر</div>
      <div class="p-time" id="time-Dhuhr">--:--</div>
      <div class="p-iqama">+15</div>
    </div>
    <div class="p-card" id="card-Asr">
      <div class="p-name">العصر</div>
      <div class="p-time" id="time-Asr">--:--</div>
      <div class="p-iqama">+15</div>
    </div>
    <div class="p-card" id="card-Maghrib">
      <div class="p-name">المغرب</div>
      <div class="p-time" id="time-Maghrib">--:--</div>
      <div class="p-iqama">+10</div>
    </div>
    <div class="p-card" id="card-Isha">
      <div class="p-name">العشاء</div>
      <div class="p-time" id="time-Isha">--:--</div>
      <div class="p-iqama">+15</div>
    </div>
  </div>

  <script>
    const PRAYER_LIST = [
      { key: "Fajr", nameAr: "الفجر", delay: 20 },
      { key: "Dhuhr", nameAr: "الظهر", delay: 15 },
      { key: "Asr", nameAr: "العصر", delay: 15 },
      { key: "Maghrib", nameAr: "المغرب", delay: 10 },
      { key: "Isha", nameAr: "العشاء", delay: 15 }
    ];

    let prayerTimings = {};
    let sunriseTime = "--:--";
    let showHijri = false;
    let cachedDay = -1;

    // متابعة حالة الإنترنت وتحديث المؤشر فوراً
    function checkNetworkState() {
      const dot = document.getElementById('netDot');
      const text = document.getElementById('netStatusText');
      if (navigator.onLine) {
        dot.classList.remove('offline');
        text.innerText = "متصل";
      } else {
        dot.classList.add('offline');
        text.innerText = "محلي (بدون نت)";
      }
    }
    window.addEventListener('online', checkNetworkState);
    window.addEventListener('offline', checkNetworkState);

    // تبديل التاريخ بالتناوب كل 6 ثوانٍ
    setInterval(() => {
      showHijri = !showHijri;
      const dateEl = document.getElementById('liveDate');
      dateEl.style.opacity = '0';
      setTimeout(() => {
        updateDateText();
        dateEl.style.opacity = '1';
      }, 400);
    }, 6000);

    function updateDateText() {
      const now = new Date();
      const dateEl = document.getElementById('liveDate');
      if (showHijri) {
        const hijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        }).format(now);
        dateEl.innerText = `${hijri} هـ`;
        dateEl.style.color = '#facc15';
      } else {
        const gregorian = now.toLocaleDateString('ar-MA', {
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });
        dateEl.innerText = `${gregorian} م`;
        dateEl.style.color = '#bfdbfe';
      }
    }

    function cleanT(str) {
      if (!str) return "--:--";
      return str.split(' ')[0].substring(0, 5);
    }

    // جلب وحفظ شهر كامل فـ التلفاز للأوفلاين
    async function syncMonthPrayers() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth() + 1;
      const storageKey = `masjid_times_${y}_${m}`;

      try {
        const res = await fetch(`https://api.aladhan.com/v1/calendarByCity/${y}/${m}?city=Kenitra&country=Morocco&method=21&tune=0,-1,0,0,0,0,0,0`);
        const json = await res.json();
        if (json.data && Array.isArray(json.data)) {
          localStorage.setItem(storageKey, JSON.stringify(json.data));
        }
      } catch (e) {
        // إذا انقطعت النت يستمر في العمل
      }
      applyDayFromCache();
    }

    function applyDayFromCache() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const storageKey = `masjid_times_${y}_${m}`;

      const stored = localStorage.getItem(storageKey);
      if (stored) {
        try {
          const days = JSON.parse(stored);
          const today = days[d - 1];
          if (today && today.timings) {
            const t = today.timings;
            prayerTimings = {
              Fajr: cleanT(t.Fajr),
              Dhuhr: cleanT(t.Dhuhr),
              Asr: cleanT(t.Asr),
              Maghrib: cleanT(t.Maghrib),
              Isha: cleanT(t.Isha)
            };
            sunriseTime = cleanT(t.Sunrise);
            document.getElementById('dispSunrise').innerText = sunriseTime;

            PRAYER_LIST.forEach(p => {
              document.getElementById(`time-${p.key}`).innerText = prayerTimings[p.key] || "--:--";
            });
            cachedDay = d;
            return;
          }
        } catch (e) {}
      }

      // إذا لم يجد الشهر في الذاكرة يحاول الاتصال المباشر
      fetch("https://api.aladhan.com/v1/timingsByCity?city=Kenitra&country=Morocco&method=21&tune=0,-1,0,0,0,0,0,0")
        .then(r => r.json())
        .then(res => {
          if (res.data && res.data.timings) {
            const t = res.data.timings;
            prayerTimings = {
              Fajr: cleanT(t.Fajr),
              Dhuhr: cleanT(t.Dhuhr),
              Asr: cleanT(t.Asr),
              Maghrib: cleanT(t.Maghrib),
              Isha: cleanT(t.Isha)
            };
            sunriseTime = cleanT(t.Sunrise);
            document.getElementById('dispSunrise').innerText = sunriseTime;
            PRAYER_LIST.forEach(p => {
              document.getElementById(`time-${p.key}`).innerText = prayerTimings[p.key] || "--:--";
            });
          }
        }).catch(err => {});
    }

    function updateTick() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('liveClock').innerText = `${h}:${m}:${s}`;

      if (now.getDate() !== cachedDay) {
        applyDayFromCache();
      }

      if (Object.keys(prayerTimings).length === 0) return;

      const curSecs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      let nextP = null;
      let diff = 0;
      let inAdhan = false;

      for (let p of PRAYER_LIST) {
        let [ph, pm] = (prayerTimings[p.key] || "0:0").split(':').map(Number);
        let pSecs = ph * 3600 + pm * 60;

        if (curSecs >= pSecs && curSecs < pSecs + 180) {
          inAdhan = true;
          document.getElementById('adhanOverlay').style.display = 'flex';
          document.getElementById('adhanPrayerSub').innerText = `حان الآن موعد أذان صلاة ${p.nameAr}`;
          break;
        }

        if (pSecs > curSecs && !nextP) {
          nextP = p;
          diff = pSecs - curSecs;
        }
      }

      if (!inAdhan) {
        document.getElementById('adhanOverlay').style.display = 'none';
      }

      if (!nextP) {
        nextP = PRAYER_LIST[0];
        let [fh, fm] = (prayerTimings["Fajr"] || "0:0").split(':').map(Number);
        diff = (86400 - curSecs) + (fh * 3600 + fm * 60);
      }

      document.querySelectorAll('.p-card').forEach(c => c.classList.remove('active-p'));
      if (nextP) {
        document.getElementById(`card-${nextP.key}`).classList.add('active-p');
        document.getElementById('countdownLabel').innerText = `${nextP.nameAr} بعد`;
        
        let rh = String(Math.floor(diff / 3600)).padStart(2, '0');
        let rm = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
        let rs = String(diff % 60).padStart(2, '0');
        document.getElementById('countdownVal').innerText = `${rh}:${rm}:${rs}`;
      }
    }

    checkNetworkState();
    updateDateText();
    syncMonthPrayers();
    setInterval(updateTick, 1000);
    setInterval(syncMonthPrayers, 12 * 3600 * 1000);
  </script>
</body>
</html>
