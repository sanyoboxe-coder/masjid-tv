<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مسجد أبي هريرة - القنيطرة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    
    /* خلفية المسجد الأصلية كما كانت شغالة تماماً */
    body {
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px 25px;
      background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.40)), url('1000208998.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    /* الشريط العلوي */
    .top-bar { 
      background: rgba(0, 0, 0, 0.45); padding: 8px 25px; border-radius: 14px;
      display: flex; justify-content: space-between; align-items: center; 
      border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(3px);
    }
    .masjid-title { font-size: 1.6rem; font-weight: 900; color: #ffffff; text-shadow: 0 2px 5px #000; }
    .top-tools { display: flex; align-items: center; gap: 14px; }
    
    .status-badge {
      font-size: 0.95rem; font-weight: bold; padding: 3px 10px; border-radius: 8px;
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.25);
    }
    .status-online { color: #4ade80; border-color: #4ade80; }
    .status-offline { color: #f87171; border-color: #f87171; }

    .temp-badge {
      font-size: 1.1rem; font-weight: bold; color: #facc15;
      background: rgba(0,0,0,0.5); padding: 3px 10px; border-radius: 8px;
      border: 1px solid rgba(250,204,21,0.4); text-shadow: 0 2px 4px #000;
    }

    .settings-trigger { cursor: pointer; opacity: 0.9; font-size: 1.5rem; }

    /* القسم الأوسط */
    .center-section { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 10px; }
    .side-box { 
      text-align: center; min-width: 155px; background: rgba(0, 0, 0, 0.45); 
      padding: 10px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(3px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .side-title { font-size: 1.3rem; font-weight: 800; color: #e2e8f0; text-shadow: 0 2px 4px #000; }
