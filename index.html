<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسجد أبي هريرة - القنيطرة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(rgba(8, 20, 48, 0.45), rgba(5, 12, 30, 0.60)), 
                  url('IMG-20260930-WA0025.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-bar {
      background: rgba(10, 25, 55, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 1.3rem;
      font-weight: 700;
    }
    .top-bar .title {
      font-size: 1.5rem;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .top-info-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .temp-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.4rem;
      font-weight: 900;
      color: #facc15;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(250, 204, 21, 0.4);
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      color: #93c5fd;
    }
    .status-dot {
      width: 11px;
      height: 11px;
      background-color: #22c55e;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #22c55e;
    }

    .center-section {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px 30px;
      width: 100%;
    }

    .side-box {
      text-align: center;
      min-width: 160px;
    }
    .side-title {
      font-size: 1.7rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 2px;
    }
    .side-time {
      font-size: 2.7rem;
      font-weight: 900;
      color: #ffffff;
      font-family: monospace;
      letter-spacing: 1px;
    }

    .clock-card {
      background: linear-gradient(180deg, #1d4ed8 0%, #1e40af 100%);
      border-radius: 20px;
      padding: 10px 45px 8px 45px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(29, 78, 216, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.25);
      min-width: 460px;
    }
    .main-clock {
      font-size: 4.8rem;
      font-weight: 900;
      font-family: monospace;
      color: #ffffff;
      line-height: 1;
      letter-spacing: 3px;
    }
    .main-date {
      font-size: 1.45rem;
      font-weight: bold;
      color: #facc15;
      margin-top: 4px;
      min-height: 32px;
      transition: opacity 0.4s ease;
    }

    .middle-info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 35px;
      margin: 2px 0;
    }

    .dhikr-box {
      flex: 1.8;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 25px;
      padding: 7px 25px;
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.5s ease;
    }

    .countdown-bar {
      flex: 1.2;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 25px;
      padding: 7px 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .countdown-bar .badge-icon {
      color: #facc15;
    }
    .countdown-bar .count-val {
      font-family: monospace;
      font-size: 1.8rem;
      color: #38bdf8;
      direction: ltr;
    }

    .prayers-row {

      justify-content: center;
      gap: 12px;
      padding: 6px 30px 6px 30px;
      width: 100%;
    }
    .p-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      padding: 10px 5px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .p-card.active-p {
      background: rgba(30, 64, 175, 0.85);
      border: 2px solid #60a5fa;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.5);
    }
    .p-name {
      font-size: 1.85rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 2px;
    }
    .p-time {
      font-size: 2.7rem;
      font-weight: 900;
      font-family: monospace;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .p-iqama {
      font-size: 1.6rem;
      font-weight: 900;
      color: #93c5fd;
      margin-top: 3px;
      direction: ltr;
    }
