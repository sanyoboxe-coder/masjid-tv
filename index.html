<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة مواقيت الصلاة - مسجد أبي هريرة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    
    body {
      color: #ffffff;
      font-family: Arial, Tahoma, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 18px;
      position: relative;
    }

    /* صورة المسجد في الخلفية */
    #bgMasjid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.85) contrast(1.05);
      transform-origin: center center;
    }

    .app-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .box-style {
      background-color: rgba(0, 0, 0, 0.60);
      border: 1px solid rgba(255, 255, 255, 0.30);
      border-radius: 12px;
    }

    /* الشريط العلوي */
    .top-bar { 
      padding: 6px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center; 
    }
    .masjid-title { font-size: 1.45rem; font-weight: bold; color: #ffffff; text-shadow: 0 2px 5px #000; }
    .top-tools { display: flex; align-items: center; gap: 10px; }
    
    .status-badge {
      font-size: 0.9rem; font-weight: bold; padding: 3px 8px; border-radius: 8px;
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.25);
    }
    .status-online { color: #4ade80; border-color: #4ade80; }
    .status-offline { color: #f87171; border-color: #f87171; }

    .temp-badge {
      font-size: 1rem; font-weight: bold; color: #facc15;
      background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 8px;
      border: 1px solid rgba(250,204,21,0.4); text-shadow: 0 2px 4px #000;
    }

    .settings-trigger { cursor: pointer; opacity: 0.9; font-size: 1.4rem; }

    /* القسم الأوسط */
    .center-section { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 5px; }
    .side-box { 
      text-align: center; min-width: 140px; padding: 6px 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .side-title { font-size: 1.15rem; font-weight: bold; color: #e2e8f0; text-shadow: 0 2px 4px #000; }
    .side-time { font-size: 2.2rem; font-weight: bold; font-family: monospace; color: #ffffff; text-shadow: 0 2px 6px #000; }

    .clock-card { 
      padding: 8px 35px; text-align: center; min-width: 460px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .main-clock { font-size: 4.4rem; font-weight: bold; font-family: monospace; line-height: 1; letter-spacing: 2px; text-shadow: 0 3px 10px #000; }
    .hijri-date { font-size: 1.35rem; font-weight: bold; color: #facc15; margin-top: 4px; text-shadow: 0 2px 5px #000; }
    .greg-date { font-size: 1.1rem; font-weight: bold; color: #ffffff; margin-top: 2px; text-shadow: 0 2px 4px #000; }

    .middle-info-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 5px; }
    .dhikr-box { 
      flex: 1.8; padding: 8px 18px; font-size: 1.25rem; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 2px 6px #000; font-weight: bold;
    }
    .countdown-bar { 
      flex: 1.2; padding: 8px 18px; display: flex; align-items: center; justify-content: center; 
      gap: 8px; font-size: 1.25rem; font-weight: bold; text-shadow: 0 2px 5px #000;
    }
    .countdown-bar .count-val { font-family: monospace; font-size: 1.7rem; color: #38bdf8; direction: ltr; font-weight: bold; text-shadow: 0 2px 6px #000; }

    /* بطاقات أوقات الصلاة */
    .prayers-row { display: flex; justify-content: space-between; gap: 10px; padding: 0 5px; }
    .p-card { 
      flex: 1; padding: 8px 4px; text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    .p-card.active-p { 
      background-color: rgba(14, 116, 144, 0.88) !important; 
      border-color: #38bdf8 !important; transform: translateY(-3px); box-shadow: 0 8px 25px rgba(56, 189, 248, 0.5);
    }
    .p-name { font-size: 1.4rem; font-weight: bold; text-shadow: 0 2px 6px #000; }
    .p-subname { font-size: 0.8rem; font-weight: bold; color: #e2e8f0; text-transform: uppercase; margin-bottom: 2px; }
    .p-time { font-size: 2.2rem; font-weight: bold; font-family: monospace; text-shadow: 0 2px 6px #000; }
    .p-iqama { font-size: 1.15rem; font-weight: bold; color: #facc15; direction: ltr; text-shadow: 0 2px 5px #000; }

    /* الشريط السفلي والتحكم في حركته */
    .bottom-bar { 
      padding: 4px 15px; overflow: hidden; white-space: nowrap; display: flex; align-items: center; height: 38px;
    }
    .marquee-moving {
      display: inline-block; padding-left: 100%; animation: marquee 30s linear infinite;
      font-size: 1.15rem; font-weight: bold; color: #facc15; text-shadow: 0 2px 6px #000;
    }
    .marquee-static {
      width: 100%; text-align: center; display: block;
      font-size: 1.15rem; font-weight: bold; color: #facc15; text-shadow: 0 2px 6px #000;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    @keyframes marquee { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(-100%,0,0); } }

    /* شاشة الإقامة */
    .fullscreen-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.96); z-index: 99999; display: none;
      flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px;
    }
    .modal-head { font-size: 3.4rem; font-weight: bold; color: #facc15; margin-bottom: 10px; }
    .modal-timer { font-size: 9.5rem; font-weight: bold; font-family: monospace; color: #facc15; text-shadow: 0 0 30px rgba(250,204,21,0.6); direction: ltr; }
    .modal-body { font-size: 2.4rem; font-weight: bold; color: #ffffff; line-height: 1.5; max-width: 90%; }
    .modal-sub { font-size: 2rem; font-weight: bold; color: #ef4444; margin-top: 25px; background: rgba(239,68,68,0.2); padding: 8px 25px; border-radius: 14px; border: 1px solid #ef4444; }

    /* نافذة الإعدادات */
    .setup-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 6, 23, 0.96); z-index: 100000;
      display: none; justify-content: center; align-items: center; padding: 15px;
    }
    .setup-box {
      background: #0f172a; border: 2px solid #38bdf8; border-radius: 20px;
      padding: 16px 20px; width: 100%; max-width: 630px; text-align: right;
      box-shadow: 0 10px 40px rgba(0,0,0,0.85); max-height: 94vh; overflow-y: auto;
    }
    .setup-title { font-size: 1.25rem; font-weight: bold; color: #38bdf8; text-align: center; margin-bottom: 8px; }
    .timing-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .timing-table th, .timing-table td { padding: 4px; text-align: center; border-bottom: 1px solid #334155; }
    .timing-table th { color: #94a3b8; font-size: 0.85rem; }
    .btn-step { background: #1e293b; border: 1px solid #475569; color: #fff; width: 28px; height: 28px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .input-val { width: 45px; text-align: center; background: #020617; border: 1px solid #38bdf8; color: #facc15; font-size: 1rem; font-weight: bold; padding: 2px; border-radius: 6px; }
    
    .field-group { margin-top: 6px; }
    .field-label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 3px; font-weight: bold; }
    .field-input { width: 100%; background: #020617; border: 1px solid #334155; color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 0.9rem; }
    .field-select { width: 100%; background: #020617; border: 1px solid #38bdf8; color: #facc15; padding: 6px 10px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; }

    .img-controls-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 4px;
      background: #020617; padding: 6px; border-radius: 8px; border: 1px solid #334155;
    }
    .btn-ctrl { background: #1e293b; border: 1px solid #38bdf8; color: #fff; padding: 5px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .btn-ctrl:focus, .btn-ctrl:active { background: #38bdf8; color: #000; outline: none; }

    .btn-save { background: #16a34a; color: #fff; width: 100%; padding: 10px; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-close { background: #475569; color: #fff; width: 100%; padding: 6px; border: none; border-radius: 10px; font-size: 0.9rem; cursor: pointer; margin-top: 5px; }
  </style>
</head>
<body>

  <!-- صورة المسجد -->
  <img id="bgMasjid" src="image2026.jpg" alt="">

  <div class="app-content">

    <div class="fullscreen-modal" id="fsModal">
      <div class="modal-head" id="fsHead">إِقَامَةُ الصَّلَاةِ</div>
      <div class="modal-timer" id="fsTimer" style="display:none;">00:00</div>
      <div class="modal-body">اسْتَوُوا وَاعْتَدِلُوا، وَأَقِيمُوا صُفُوفَكُمْ</div>
      <div class="modal-sub">📴 يُرْجَى إِغْلَاقُ الْهَوَاتِفِ النَّقَّالَةِ جَزَاكُمُ اللهُ خَيْرًا</div>
    </div>

    <!-- لوحة الإعدادات -->
    <div class="setup-overlay" id="setupModal">
      <div class="setup-box">
        <div class="setup-title">⚙️ لوحة تحكم وإعدادات المسجد</div>

        <!-- 1. تعديل اسم المسجد -->
        <div class="field-group">
          <label class="field-label">اسم المسجد الظاهر في الأعلى:</label>
          <input type="text" id="cfg_title" class="field-input">
        </div>

        <!-- 2. تعديل وقت صلاة الجمعة -->
        <div class="field-group">
          <label class="field-label">وقت صلاة الجمعة (مثلاً 13:15 أو 13:00):</label>
          <input type="text" id="cfg_jumua" class="field-input" placeholder="13:15">
        </div>

        <!-- 3. التحكم في الشريط السفلي -->
        <div class="field-group">
          <label class="field-label">حالة الشريط السفلي:</label>
          <select id="cfg_marquee_mode" class="field-select">
            <option value="moving">شريط متحرك (يدوز)</option>
            <option value="static">شريط ثابت (واقف)</option>
          </select>
        </div>

        <!-- 4. درجة الحرارة -->
        <div class="field-group">
          <label class="field-label">درجة الحرارة (°C):</label>
          <input type="number" id="cfg_temp" class="field-input">
        </div>
        
        <!-- 5. نظام التوقيت الصيفي -->
        <div class="field-group">
          <label class="field-label">نظام التوقيت (حل مشكل الساعة الزائدة):</label>
          <select id="cfg_tz" class="field-select">
            <option value="1">توقيت المغرب الحالي (GMT+1)</option>
            <option value="0">توقيت غرينتش (GMT / رمضان)</option>
          </select>
        </div>

        <!-- 6. جدول ضبط دقائق الصلوات -->
        <table class="timing-table">
          <thead>
            <tr>
              <th>الصلاة</th>
              <th>الوقت الحالي</th>
              <th>تعديل الدقائق (+ / -)</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td style="font-weight: bold; color: #38bdf8;">الفجر</td>
              <td id="disp_base_Fajr" style="direction:ltr; font-family:monospace;">--:--</td>
              <td><button type="button" class="btn-step" onclick="adjAdhan('Fajr', -1)">-</button> <input type="text" id="adj_Fajr" class="input-val" readonly> <button type="button" class="btn-step" onclick="adjAdhan('Fajr', 1)">+</button></td>
            </tr>
            <tr>
              <td style="font-weight: bold; color: #38bdf8;">الشروق</td>
              <td id="disp_base_Sunrise" style="direction:ltr; font-family:monospace;">--:--</td>
              <td><button type="button" class="btn-step" onclick="adjAdhan('Sunrise', -1)">-</button> <input type="text" id="adj_Sunrise" class="input-val" readonly> <button type="button" class="btn-step" onclick="adjAdhan('Sunrise', 1)">+</button></td>
            </tr>
            <tr>
              <td style="font-weight: bold; color: #38bdf8;">الظهر</td>
              <td id="disp_base_Dhuhr" style="direction:ltr; font-family:monospace;">--:--</td>
              <td><button type="button" class="btn-step" onclick="adjAdhan('Dhuhr', -1)">-</button> <input type="text" id="adj_Dhuhr" class="input-val" readonly> <button type="button" class="btn-step" onclick="adjAdhan('Dhuhr', 1)">+</button></td>
            </tr>
            <tr>
              <td style="font-weight: bold; color: #38bdf8;">العصر</td>
              <td id="disp_base_Asr" style="direction:ltr; font-family:monospace;">--:--</td>
              <td><button type="button" class="btn-step" onclick="adjAdhan('Asr', -1)">-</button> <input type="text" id="adj_Asr" class="input-val" readonly> <button type="button" class="btn-step" onclick="adjAdhan('Asr', 1)">+</button></td>
            </tr>
            <tr>
              <td style="font-weight: bold; color: #38bdf8;">المغرب</td>
              <td id="disp_base_Maghrib" style="direction:ltr; font-family:monospace;">--:--</td>
              <td><button type="button" class="btn-step" onclick="adjAdhan('Maghrib', -1)">-</button> <input type="text" id="adj_Maghrib" class="input-val" readonly> <button type="button" class="btn-step" onclick="adjAdhan('Maghrib', 1)">+</button></td>
            </tr>
            <tr>
              <td style="font-weight: bold; color: #
