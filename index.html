<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسجد أبي هريرة - القنيطرة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(rgba(8, 20, 48, 0.45), rgba(5, 12, 30, 0.60)), 
                  url('IMG-20260930-WA0025.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top-bar {
      background: rgba(10, 25, 55, 0.85);
      padding: 8px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 1.3rem;
      font-weight: 700;
    }
    .temp-badge {
      font-size: 1.4rem;
      font-weight: 900;
      color: #facc15;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 14px;
      border-radius: 20px;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      color: #93c5fd;
    }
    .status-dot {
      width: 11px;
      height: 11px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }
    .center-section {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px 30px;
      width: 100%;
    }
    .side-box { text-align: center; min-width: 160px; }
    .side-title { font-size: 1.7rem; font-weight: 800; }
    .side-time { font-size: 2.7rem; font-weight: 900; font-family: monospace; }
    .clock-card {
      background: linear-gradient(180deg, #1d4ed8 0%, #1e40af 100%);
      border-radius: 20px;
      padding: 10px 45px 8px 45px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(29, 78, 216, 0.5);
      min-width: 460px;
    }
    .main-clock { font-size: 4.8rem; font-weight: 900; font-family: monospace; }
    .main-date { font-size: 1.45rem; font-weight: bold; color: #facc15; margin-top: 4px; transition: opacity 0.3s; }
    .middle-info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 35px;
    }
    .dhikr-box {
      flex: 1.8;
      background: rgba(15, 23, 42, 0.75);
      border-radius: 25px;
      padding: 7px 25px;
      font-size: 1.35rem;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .countdown-bar {
      flex: 1.2;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 25px;
      padding: 7px 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
    }
    .countdown-bar .count-val { font-family: monospace; font-size: 1.8rem; color: #38bdf8; direction: ltr; }
    .prayers-row { display: flex; justify-content: center; gap: 12px; padding: 6px 30px; }
    .p-card {
      flex: 1;
      background: rgba(15, 23, 42, 0.72);
      border-radius: 18px;
      padding: 10px 5px;
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.18);
    }
    .p-card.active-p {
      background: rgba(30, 64, 175, 0.85);
      border: 2px solid #60a5fa;
      transform: translateY(-3px);
    }
    .p-name { font-size: 1.85rem; font-weight: 900; }
    .p-time { font-size: 2.7rem; font-weight: 900; font-family: monospace; }
    .p-iqama { font-size: 1.6rem; font-weight: 900; color: #93c5fd; direction: ltr; }
