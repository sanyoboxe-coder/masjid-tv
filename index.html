<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسجد أبي هريرة - القنيطرة</title>
  <style>
    :root {
      --box-bg: rgba(0, 0, 0, 0.55);
      --box-border: rgba(255, 255, 255, 0.28);
      --active-card-bg: rgba(14, 116, 144, 0.85);
      --accent-color: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    
    body {
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px 25px;
      position: relative;
      background-color: #0b1329;
    }

    /* صورة المسجد كخلفية كاملة */
    .bg-fullscreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.85) contrast(1.05);
      transform-origin: center center;
    }

    .app-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* الشريط العلوي */
    .top-bar { 
      background: var(--box-bg); padding: 8px 25px; border-radius: 14px;
      display: flex; justify-content: space-between; align-items: center; 
      border: 1px solid var(--box-border); backdrop-filter: blur(4px);
    }
    .masjid-title { font-size: 1.6rem; font-weight: 900; color: #ffffff; text-shadow: 0 2px 6px #000; }
    .top-tools { display: flex; align-items: center; gap: 14px; }
    
    .status-badge {
      font-size: 0.95rem; font-weight: 800; padding: 4px 10px; border-radius: 8px;
      background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2);
    }
    .status-online { color: #4ade80; border-color: #4ade80; }
    .status-offline { color: #f87171; border-color: #f87171; }

    .temp-badge {
      font-size: 1.1rem; font-weight: 900; color: #facc15;
      background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 8px;
      border: 1px solid rgba(250,204,21,0.4); text-shadow: 0 2px 4px #000;
    }

    .icon-btn { cursor: pointer; font-size: 1.5rem; transition: transform 0.2s; background: none; border: none; color: inherit; }
    .icon-btn:focus, .icon-btn:hover { transform: scale(1.15); outline: none; }

    /* القسم الأوسط */
    .center-section { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 10px; }
    .side-box { 
      text-align: center; min-width: 155px; background: var(--box-bg); 
      padding: 10px 20px; border-radius: 16px; border: 1px solid var(--box-border);
      backdrop-filter: blur(4px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .side-title { font-size: 1.3rem; font-weight: 800; color: #e2e8f0; text-shadow: 0 2px 4px #000; }
    .side-time { font-size: 2.6rem; font-weight: 900; font-family: monospace; color: #ffffff; text-shadow: 0 2px 6px #000; }

    .clock-card { 
      background: var(--box-bg); 
      border-radius: 24px; padding: 12px 45px; text-align: center; min-width: 520px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 2px solid var(--box-border);
      backdrop-filter: blur(5px);
    }
    .main-clock { font-size: 5rem; font-weight: 900; font-family: monospace; line-height: 1; letter-spacing: 2px; text-shadow: 0 3px 10px #000; }
    .hijri-date { font-size: 1.5rem; font-weight: 900; color: #facc15; margin-top: 6px; text-shadow: 0 2px 5px #000; }
    .greg-date { font-size: 1.2rem; font-weight: 800; color: #ffffff; margin-top: 2px; text-shadow: 0 2px 4px #000; }

    .middle-info-bar { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 0 10px; }
    .dhikr-box { 
      flex: 1.8; background: var(--box-bg); border-radius: 18px; 
      padding: 10px 25px; font-size: 1.35rem; text-align: center; white-space: nowrap; 
      overflow: hidden; text-overflow: ellipsis; border: 1px solid var(--box-border);
      backdrop-filter: blur(4px); text-shadow: 0 2px 6px #000; font-weight: bold;
    }
    .countdown-bar { 
      flex: 1.2; background: var(--box-bg); border-radius: 18px; 
      padding: 10px 25px; display: flex; align-items: center; justify-content: center; 
      gap: 10px; font-size: 1.35rem; font-weight: 800; border: 1px solid var(--box-border);
      backdrop-filter: blur(4px); text-shadow: 0 2px 5px #000;
    }
    .countdown-bar .count-val { font-family: monospace; font-size: 1.9rem; color: var(--accent-color); direction: ltr; font-weight: 900; text-shadow: 0 2px 6px #000; }

    /* بطاقات أوقات الصلاة */
    .prayers-row { display: flex; justify-content: space-between; gap: 12px; padding: 0 10px; }
    .p-card { 
      flex: 1; background: var(--box-bg); border-radius: 18px; 
      padding: 10px 6px; text-align: center; border: 1.5px solid var(--box-border);
      backdrop-filter: blur(4px); box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    .p-card.active-p { 
      background: var(--active-card-bg); 
      border-color: var(--accent-color); transform: translateY(-4px); box-shadow: 0 8px 25px rgba(56, 189, 248, 0.5);
    }
    .p-name { font-size: 1.55rem; font-weight: 900; text-shadow: 0 2px 6px #000; }
    .p-subname { font-size: 0.85rem; font-weight: 700; color: #e2e8f0; text-transform: uppercase; margin-bottom: 2px; }
    .p-time { font-size: 2.5rem; font-weight: 900; font-family: monospace; text-shadow: 0 2px 6px #000; }
    .p-iqama { font-size: 1.25rem; font-weight: 900; color: #facc15; direction: ltr; text-shadow: 0 2px 5px #000; }

    /* الشريط السفلي */
    .bottom-bar { 
      background: var(--box-bg); padding: 6px 20px; border-radius: 12px; 
      overflow: hidden; white-space: nowrap; display: flex; align-items: center; height: 44px;
      border: 1px solid var(--box-border); backdrop-filter: blur(4px);
    }
    .marquee-content {
      display: inline-block; padding-left: 100%; animation: marquee 30s linear infinite;
      font-size: 1.3rem; font-weight: 800; color: #facc15; text-shadow: 0 2px 6px #000;
    }
    @keyframes marquee { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(-100%,0,0); } }

    /* نافذة اختيار الألوان الموسعة */
    .color-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 6, 23, 0.94); z-index: 100001;
      display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .color-box {
      background: #0f172a; border: 2px solid #38bdf8; border-radius: 20px;
      padding: 22px 25px; width: 100%; max-width: 580px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.85);
    }
    .theme-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0; }
    .btn-theme {
      padding: 12px; border-radius: 10px; border: 2px solid #334155;
      color: #fff; font-size: 0.95rem; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
