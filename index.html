<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسجد أبي هريرة - القنيطرة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    
    body {
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px 25px;
      position: relative;
      background: radial-gradient(circle at center, #1e3a8a 0%, #0a1128 70%, #020617 100%);
    }

    /* صورة المسجد المرفوعة عندك في GitHub كخلفية كاملة */
    .bg-fullscreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.32) contrast(1.15);
    }

    .app-content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* الشريط العلوي */
    .top-bar { 
      background: rgba(15, 23, 42, 0.78); padding: 8px 25px; border-radius: 14px;
      display: flex; justify-content: space-between; align-items: center; 
      border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(8px);
    }
    .masjid-title { font-size: 1.55rem; font-weight: 900; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
    .top-tools { display: flex; align-items: center; gap: 15px; }
    .settings-trigger { cursor: pointer; opacity: 0.85; font-size: 1.5rem; transition: transform 0.2s; }
    .settings-trigger:hover { transform: scale(1.1); }

    /* القسم الأوسط */
    .center-section { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 10px; }
    .side-box { 
      text-align: center; min-width: 155px; background: rgba(15, 23, 42, 0.78); 
      padding: 10px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(8px); box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }
    .side-title { font-size: 1.3rem; font-weight: 800; color: #94a3b8; }
    .side-time { font-size: 2.6rem; font-weight: 900; font-family: monospace; color: #f8fafc; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }

    .clock-card { 
      background: rgba(15, 23, 42, 0.85); 
      border-radius: 24px; padding: 12px 45px; text-align: center; min-width: 520px; 
      box-shadow: 0 15px 40px rgba(0,0,0,0.8); border: 2px solid rgba(56, 189, 248, 0.45);
      backdrop-filter: blur(10px);
    }
    .main-clock { font-size: 4.8rem; font-weight: 900; font-family: monospace; line-height: 1; letter-spacing: 2px; text-shadow: 0 3px 12px rgba(0,0,0,0.95); }
    .hijri-date { font-size: 1.45rem; font-weight: 900; color: #facc15; margin-top: 6px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
    .greg-date { font-size: 1.15rem; font-weight: 700; color: #93c5fd; margin-top: 2px; }

    .middle-info-bar { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 0 10px; }
    .dhikr-box { 
      flex: 1.8; background: rgba(15, 23, 42, 0.80); border-radius: 18px; 
      padding: 10px 25px; font-size: 1.3rem; text-align: center; white-space: nowrap; 
      overflow: hidden; text-overflow: ellipsis; border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(8px); text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }
    .countdown-bar { 
      flex: 1.2; background: rgba(15, 23, 42, 0.85); border-radius: 18px; 
      padding: 10px 25px; display: flex; align-items: center; justify-content: center; 
      gap: 10px; font-size: 1.35rem; font-weight: 800; border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
    }
    .countdown-bar .count-val { font-family: monospace; font-size: 1.8rem; color: #38bdf8; direction: ltr; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }

    /* بطاقات أوقات الصلاة بالمدد الأصلية */
    .prayers-row { display: flex; justify-content: space-between; gap: 12px; padding: 0 10px; }
    .p-card { 
      flex: 1; background: rgba(15, 23, 42, 0.78); border-radius: 18px; 
      padding: 10px 6px; text-align: center; border: 2px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(8px); box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }
    .p-card.active-p { 
      background: rgba(30, 64, 175, 0.90); 
      border-color: #38bdf8; transform: translateY(-4px); box-shadow: 0 10px 30px rgba(56, 189, 248, 0.45);
    }
    .p-name { font-size: 1.5rem; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
    .p-subname { font-size: 0.85rem; font-weight: 700; color: #cbd5e1; text-transform: uppercase; margin-bottom: 2px; }
    .p-time { font-size: 2.4rem; font-weight: 900; font-family: monospace; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
    .p-iqama { font-size: 1.2rem; font-weight: 800; color: #93c5fd; direction: ltr; }

    /* الشريط السفلي المتحرك */
    .bottom-bar { 
      background: rgba(15, 23, 42, 0.85); padding: 6px 20px; border-radius: 12px; 
      overflow: hidden; white-space: nowrap; display: flex; align-items: center; height: 44px;
      border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(8px);
    }
    .marquee-content {
      display: inline-block; padding-left: 100%; animation: marquee 30s linear infinite;
      font-size: 1.25rem; font-weight: 800; color: #facc15; text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }
    @keyframes marquee { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(-100%,0,0); } }

    /* شاشة الإقامة */
    .fullscreen-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 6, 23, 0.98); z-index: 99999; display: none;
      flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px;
    }
    .modal-head { font-size: 3.4rem; font-weight: 900; color: #facc15; margin-bottom: 10px; }
    .modal-timer { font-size: 9.5rem; font-weight: 900; font-family: monospace; color: #facc15; text-shadow: 0 0 30px rgba(250,204,21,0.6); direction: ltr; }
    .modal-body { font-size: 2.4rem; font-weight: 800; color: #ffffff; line-height: 1.5; max-width: 90%; }
